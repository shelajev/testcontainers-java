      uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3
      with:
        gradle-home-cache-includes: |
          caches
          notifications
          jdks
        gradle-home-cache-cleanup: true
